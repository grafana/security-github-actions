name: Trivy image scan
description: >-
  Scan a locally built container image with Trivy and post an informational
  comment on the pull request. The image SBOM is cached by layer digest so an
  unchanged image is not re-analysed; vulnerabilities are always matched against
  the current database. When a baseline SBOM is available (explicit baseline image,
  cached baseline, or baseline artifact from the base branch), the comment also
  lists vulnerabilities introduced and resolved by the change.
  This action never fails the job because of findings.

inputs:
  image-ref:
    description: >-
      Image reference present in the local Docker daemon, e.g. `my-app:pr-${{ github.sha }}`.
      With docker/build-push-action set `load: true` so the image is loaded.
    required: true
  image-name:
    description: >-
      Stable name for this image used in cache keys, baseline keys, artifact names and the
      comment id. Must be the same on pull_request and push runs. Defaults to image-ref
      without tag/digest.
    required: false
    default: ""
  severity:
    description: "Comma-separated severities to report."
    required: false
    default: "CRITICAL,HIGH"
  ignore-unfixed:
    description: "Only report vulnerabilities that have a fixed version."
    required: false
    default: "false"
  trivyignores:
    description: "Comma-separated workspace-relative paths to .trivyignore files (concatenated)."
    required: false
    default: ""
  timeout:
    description: "Trivy timeout applied to each Trivy invocation."
    required: false
    default: "10m"
  baseline-image-ref:
    description: >-
      Image to diff against instead of the cached/artifact baseline, e.g. the image your
      default branch last pushed to a registry. Pulled if not present locally; log in to
      the registry before this step. Its SBOM is cached by layer digest like the main image.
    required: false
    default: ""
  save-baseline:
    description: >-
      Save this image's SBOM as the baseline for the current branch (Actions cache and a
      90-day workflow artifact) so pull requests targeting it can report introduced/resolved
      vulnerabilities. `auto` saves on push events only.
    required: false
    default: "auto"
  baseline-ref:
    description: "Branch whose baseline to diff against. Defaults to the PR base branch."
    required: false
    default: ""
  cache-sbom:
    description: >-
      Cache the image SBOM keyed on layer digests. Set to false for workflows that scan a
      stream of distinct images where the cache would never hit.
    required: false
    default: "true"
  comment:
    description: "Post or update an informational comment on the pull request."
    required: false
    default: "true"
  max-rows:
    description: "Maximum number of rows in each findings table."
    required: false
    default: "100"
  github-token:
    description: >-
      Token used to post the PR comment and to look up baseline artifacts.
      Needs `pull-requests: write` for comments and `actions: read` for the artifact fallback.
    required: false
    default: ${{ github.token }}

outputs:
  report-path:
    description: "Path to the Trivy JSON vulnerability report."
    value: ${{ steps.meta.outputs.report-path }}
  sbom-path:
    description: "Path to the CycloneDX SBOM of the image."
    value: ${{ steps.meta.outputs.sbom-path }}
  sbom-cache-hit:
    description: "true when a valid SBOM was restored from cache instead of generated."
    value: ${{ steps.check-sbom.outputs.valid == 'true' }}
  baseline-found:
    description: "true when a baseline SBOM was available."
    value: ${{ steps.report.outputs.baseline-found }}
  baseline-source:
    description: "Where the baseline came from: image, cache, artifact or none."
    value: ${{ steps.scan.outputs.baseline-source }}
  critical:
    description: "Number of CRITICAL findings."
    value: ${{ steps.report.outputs.critical }}
  high:
    description: "Number of HIGH findings."
    value: ${{ steps.report.outputs.high }}
  medium:
    description: "Number of MEDIUM findings."
    value: ${{ steps.report.outputs.medium }}
  low:
    description: "Number of LOW findings."
    value: ${{ steps.report.outputs.low }}
  total:
    description: "Total findings at the requested severities."
    value: ${{ steps.report.outputs.total }}
  fixable:
    description: "Findings that have a fixed version."
    value: ${{ steps.report.outputs.fixable }}
  introduced:
    description: "Findings present in this image but not in the baseline (empty without baseline)."
    value: ${{ steps.report.outputs.introduced }}
  resolved:
    description: "Findings present in the baseline but not in this image (empty without baseline)."
    value: ${{ steps.report.outputs.resolved }}

runs:
  using: composite
  steps:
    - name: Inspect image and compute keys
      id: meta
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        IMAGE_NAME: ${{ inputs.image-name }}
        BASELINE_IMAGE_REF: ${{ inputs.baseline-image-ref }}
        SAVE_BASELINE: ${{ inputs.save-baseline }}
        BASELINE_REF: ${{ inputs.baseline-ref }}
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        BASE_REF: ${{ github.base_ref }}
        SHA: ${{ github.sha }}
        # renovate: datasource=github-releases depName=aquasecurity/trivy
        TRIVY_BIN_VERSION: v0.76.2
      run: |
        set -euo pipefail

        for tool in docker curl jq sha256sum; do
          command -v "${tool}" >/dev/null || { echo "::error::${tool} is required on the runner"; exit 1; }
        done

        layers_of() { docker image inspect --format '{{json .RootFS.Layers}}' "$1" 2>/dev/null; }
        sanitize() { printf '%s' "$1" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-80; }
        key_hash() { printf '%s|%s' "$1" "${TRIVY_BIN_VERSION}" | sha256sum | cut -c1-32; }

        if ! layers=$(layers_of "${IMAGE_REF}"); then
          echo "::error::Image '${IMAGE_REF}' not found in the local Docker daemon. Build it in this job first (with docker/build-push-action use 'load: true')."
          exit 1
        fi

        if [[ -z "${IMAGE_NAME}" ]]; then
          # Strip digest and tag; keep registry/repo path.
          IMAGE_NAME="${IMAGE_REF%%@*}"
          IMAGE_NAME="${IMAGE_NAME%:*}"
        fi
        slug=$(sanitize "${IMAGE_NAME}")

        # Layer digests are content-addressed: identical layers give the same key even
        # when the image ID differs because of a new build timestamp.
        sbom_key="trivy-image-sbom-v1-${slug}-$(key_hash "${layers}")"

        # Optional explicit baseline image. Failure to obtain it degrades to the other
        # baseline sources rather than failing the job.
        baseline_image_key=""
        if [[ -n "${BASELINE_IMAGE_REF}" ]]; then
          if ! base_layers=$(layers_of "${BASELINE_IMAGE_REF}"); then
            echo "Pulling baseline image ${BASELINE_IMAGE_REF}"
            if docker pull --quiet "${BASELINE_IMAGE_REF}" >/dev/null && base_layers=$(layers_of "${BASELINE_IMAGE_REF}"); then
              :
            else
              echo "::warning::Could not pull baseline image '${BASELINE_IMAGE_REF}'; falling back to cached/artifact baseline."
              base_layers=""
            fi
          fi
          if [[ -n "${base_layers}" ]]; then
            baseline_image_key="trivy-image-baseline-sbom-v1-${slug}-$(key_hash "${base_layers}")"
          fi
        fi

        save_baseline=false
        if [[ "${SAVE_BASELINE}" == "true" || ( "${SAVE_BASELINE}" == "auto" && "${EVENT_NAME}" == "push" ) ]]; then
          save_baseline=true
        fi
        if [[ -z "${BASELINE_REF}" ]]; then
          BASELINE_REF="${BASE_REF}"
        fi

        work_dir="${RUNNER_TEMP}/trivy-image/${slug}"
        mkdir -p "${work_dir}/baseline"

        # trivy-db is published roughly every six hours; bucket the DB cache to match.
        db_bucket="$(date -u +%Y-%m-%d)-$(( 10#$(date -u +%H) / 6 ))"

        {
          echo "slug=${slug}"
          echo "image-name=${IMAGE_NAME}"
          echo "trivy-version=${TRIVY_BIN_VERSION}"
          echo "cache-dir=${RUNNER_TEMP}/trivy-cache"
          echo "work-dir=${work_dir}"
          echo "sbom-path=${work_dir}/sbom.cdx.json"
          echo "report-path=${work_dir}/report.json"
          echo "baseline-dir=${work_dir}/baseline"
          echo "sbom-key=${sbom_key}"
          echo "baseline-image-key=${baseline_image_key}"
          echo "baseline-save-key=trivy-image-baseline-v1-${slug}-$(sanitize "${REF_NAME}")-${SHA}"
          echo "baseline-restore-prefix=trivy-image-baseline-v1-${slug}-$(sanitize "${BASELINE_REF}")-"
          echo "save-baseline=${save_baseline}"
          echo "baseline-ref=${BASELINE_REF}"
          echo "db-bucket=${db_bucket}"
        } >> "${GITHUB_OUTPUT}"

    - name: Install Trivy
      id: install
      shell: bash
      env:
        TRIVY_BIN_VERSION: ${{ steps.meta.outputs.trivy-version }}
      run: |
        set -euo pipefail
        ver="${TRIVY_BIN_VERSION#v}"
        case "$(uname -m)" in
          x86_64)        arch="64bit" ;;
          aarch64|arm64) arch="ARM64" ;;
          *) echo "::error::Unsupported runner architecture: $(uname -m)"; exit 1 ;;
        esac
        archive="trivy_${ver}_Linux-${arch}.tar.gz"
        base="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_BIN_VERSION}"
        curl_opts=(-sSfL --retry 3 --retry-all-errors --connect-timeout 10)

        dir="${RUNNER_TEMP}/trivy-bin"
        mkdir -p "${dir}"
        cd "${dir}"
        curl "${curl_opts[@]}" --max-time 180 -o "${archive}" "${base}/${archive}"
        curl "${curl_opts[@]}" --max-time 30 -o checksums.txt "${base}/trivy_${ver}_checksums.txt"
        if ! expected=$(grep " ${archive}\$" checksums.txt); then
          echo "::error::No checksum for ${archive} in trivy_${ver}_checksums.txt; the release layout may have changed."
          exit 1
        fi
        sha256sum -c - <<< "${expected}"
        tar -xzf "${archive}" trivy
        rm -f "${archive}" checksums.txt
        ./trivy --version
        echo "trivy=${dir}/trivy" >> "${GITHUB_OUTPUT}"

    - name: Restore Trivy vulnerability DB
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Only the DBs; the layer analysis cache under the same root is per-image and not worth keeping.
        path: |
          ${{ steps.meta.outputs.cache-dir }}/db
          ${{ steps.meta.outputs.cache-dir }}/java-db
        key: trivy-db-v2-${{ steps.meta.outputs.db-bucket }}
        restore-keys: trivy-db-v2-

    - name: Update Trivy DB
      shell: bash
      env:
        TRIVY: ${{ steps.install.outputs.trivy }}
        TRIVY_CACHE_DIR: ${{ steps.meta.outputs.cache-dir }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if "${TRIVY}" image --download-db-only --timeout "${TIMEOUT}" --quiet; then
            exit 0
          fi
          if [[ "${attempt}" -lt 3 ]]; then
            echo "Trivy DB download failed (attempt ${attempt}); retrying"
            sleep $(( attempt * 15 ))
          fi
        done
        echo "::error::Could not download the Trivy vulnerability DB after 3 attempts."
        exit 1

    - name: Restore cached SBOM
      id: restore-sbom
      if: inputs.cache-sbom == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.meta.outputs.sbom-path }}
        key: ${{ steps.meta.outputs.sbom-key }}

    - name: Validate cached SBOM
      id: check-sbom
      shell: bash
      env:
        SBOM_PATH: ${{ steps.meta.outputs.sbom-path }}
        CACHE_HIT: ${{ steps.restore-sbom.outputs.cache-hit }}
      run: |
        set -euo pipefail
        valid=false
        if [[ "${CACHE_HIT}" == "true" ]]; then
          if jq -e '.bomFormat == "CycloneDX"' "${SBOM_PATH}" >/dev/null 2>&1; then
            valid=true
          else
            echo "::warning::Cached SBOM is invalid; regenerating."
            rm -f "${SBOM_PATH}"
          fi
        fi
        echo "valid=${valid}" >> "${GITHUB_OUTPUT}"

    - name: Generate SBOM
      if: steps.check-sbom.outputs.valid != 'true'
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        SBOM_PATH: ${{ steps.meta.outputs.sbom-path }}
        TIMEOUT: ${{ inputs.timeout }}
        TRIVY: ${{ steps.install.outputs.trivy }}
        TRIVY_CACHE_DIR: ${{ steps.meta.outputs.cache-dir }}
      run: |
        set -euo pipefail
        "${TRIVY}" image \
          --image-src docker \
          --format cyclonedx \
          --output "${SBOM_PATH}" \
          --timeout "${TIMEOUT}" \
          --skip-db-update \
          --quiet \
          "${IMAGE_REF}"

    - name: Save SBOM to cache
      if: inputs.cache-sbom == 'true' && steps.check-sbom.outputs.valid != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.meta.outputs.sbom-path }}
        key: ${{ steps.meta.outputs.sbom-key }}

    # Baseline resolution, in priority order: explicit baseline image, cached baseline
    # for the base branch, baseline artifact from the base branch's last run.

    - name: Restore baseline image SBOM
      id: restore-baseline-image
      if: steps.meta.outputs.baseline-image-key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.meta.outputs.baseline-dir }}
        key: ${{ steps.meta.outputs.baseline-image-key }}

    - name: Generate baseline image SBOM
      id: generate-baseline-image
      if: steps.meta.outputs.baseline-image-key != '' && steps.restore-baseline-image.outputs.cache-hit != 'true'
      shell: bash
      env:
        BASELINE_IMAGE_REF: ${{ inputs.baseline-image-ref }}
        BASELINE_DIR: ${{ steps.meta.outputs.baseline-dir }}
        TIMEOUT: ${{ inputs.timeout }}
        TRIVY: ${{ steps.install.outputs.trivy }}
        TRIVY_CACHE_DIR: ${{ steps.meta.outputs.cache-dir }}
      run: |
        set -euo pipefail
        generated=false
        if "${TRIVY}" image --image-src docker --format cyclonedx \
             --output "${BASELINE_DIR}/sbom.cdx.json" --timeout "${TIMEOUT}" --skip-db-update --quiet \
             "${BASELINE_IMAGE_REF}"; then
          generated=true
        else
          echo "::warning::Could not generate an SBOM for baseline image '${BASELINE_IMAGE_REF}'; continuing without it."
          rm -f "${BASELINE_DIR}/sbom.cdx.json"
        fi
        echo "generated=${generated}" >> "${GITHUB_OUTPUT}"

    - name: Save baseline image SBOM to cache
      if: steps.generate-baseline-image.outputs.generated == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.meta.outputs.baseline-dir }}
        key: ${{ steps.meta.outputs.baseline-image-key }}

    - name: Restore cached baseline SBOM
      id: restore-baseline
      if: steps.meta.outputs.baseline-ref != '' && steps.meta.outputs.baseline-image-key == ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.meta.outputs.baseline-dir }}
        # Exact key intentionally never matches; restore-keys picks the newest baseline for the branch.
        key: ${{ steps.meta.outputs.baseline-restore-prefix }}never
        restore-keys: ${{ steps.meta.outputs.baseline-restore-prefix }}

    - name: Fetch baseline SBOM artifact
      id: baseline-artifact
      if: steps.meta.outputs.baseline-ref != '' && steps.meta.outputs.baseline-image-key == ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        SLUG: ${{ steps.meta.outputs.slug }}
        BASELINE_REF: ${{ steps.meta.outputs.baseline-ref }}
        BASELINE_DIR: ${{ steps.meta.outputs.baseline-dir }}
      run: |
        set -euo pipefail
        found=false
        if [[ -s "${BASELINE_DIR}/sbom.cdx.json" ]]; then
          echo "found=${found}" >> "${GITHUB_OUTPUT}"   # cached baseline already present
          exit 0
        fi

        name="trivy-image-baseline-${SLUG}"
        if artifacts=$(gh api "repos/${REPO}/actions/artifacts?name=${name}&per_page=100" 2>/dev/null); then
          artifact_id=$(jq -r --arg branch "${BASELINE_REF}" '
            [.artifacts[] | select(.expired == false and .workflow_run.head_branch == $branch)]
            | sort_by(.created_at) | last | .id // empty' <<< "${artifacts}")
          if [[ -n "${artifact_id}" ]]; then
            zip="${RUNNER_TEMP}/${name}.zip"
            if gh api "repos/${REPO}/actions/artifacts/${artifact_id}/zip" > "${zip}" \
               && unzip -o -q "${zip}" -d "${BASELINE_DIR}" \
               && jq -e '.bomFormat == "CycloneDX"' "${BASELINE_DIR}/sbom.cdx.json" >/dev/null 2>&1; then
              found=true
              echo "Using baseline artifact ${artifact_id} from ${BASELINE_REF}"
            else
              echo "::warning::Baseline artifact ${artifact_id} could not be downloaded or is invalid; continuing without it."
              rm -f "${BASELINE_DIR}/sbom.cdx.json"
            fi
            rm -f "${zip}"
          else
            echo "No baseline artifact for ${BASELINE_REF} yet."
          fi
        else
          echo "::notice::Could not list workflow artifacts (does the token have actions: read?); skipping artifact baseline."
        fi
        echo "found=${found}" >> "${GITHUB_OUTPUT}"

    - name: Scan SBOMs for vulnerabilities
      id: scan
      shell: bash
      env:
        WORK_DIR: ${{ steps.meta.outputs.work-dir }}
        SBOM_PATH: ${{ steps.meta.outputs.sbom-path }}
        REPORT_PATH: ${{ steps.meta.outputs.report-path }}
        BASELINE_DIR: ${{ steps.meta.outputs.baseline-dir }}
        BASELINE_IMAGE_KEY: ${{ steps.meta.outputs.baseline-image-key }}
        ARTIFACT_FOUND: ${{ steps.baseline-artifact.outputs.found }}
        SEVERITY: ${{ inputs.severity }}
        IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
        TRIVYIGNORES: ${{ inputs.trivyignores }}
        TIMEOUT: ${{ inputs.timeout }}
        TRIVY: ${{ steps.install.outputs.trivy }}
        TRIVY_CACHE_DIR: ${{ steps.meta.outputs.cache-dir }}
      run: |
        set -euo pipefail

        # Without trivyignores Trivy falls back to ./.trivyignore in the consumer repo, if present.
        args=(--format json --severity "${SEVERITY}" --timeout "${TIMEOUT}" --skip-db-update --quiet)
        if [[ "${IGNORE_UNFIXED}" == "true" ]]; then
          args+=(--ignore-unfixed)
        fi
        if [[ -n "${TRIVYIGNORES}" ]]; then
          ignorefile="${WORK_DIR}/.trivyignore"
          : > "${ignorefile}"
          IFS=',' read -ra files <<< "${TRIVYIGNORES}"
          for f in "${files[@]}"; do
            f="${f#"${f%%[![:space:]]*}"}"; f="${f%"${f##*[![:space:]]}"}"
            [[ -n "${f}" ]] || continue
            if [[ "${f}" == /* || "${f}" == *..* ]]; then
              echo "::error::trivyignore path must be workspace-relative: ${f}"; exit 1
            fi
            [[ -f "${f}" ]] || { echo "::error::trivyignore file not found: ${f}"; exit 1; }
            cat "${f}" >> "${ignorefile}"; echo >> "${ignorefile}"
          done
          args+=(--ignorefile "${ignorefile}")
        fi

        "${TRIVY}" sbom "${args[@]}" --output "${REPORT_PATH}" "${SBOM_PATH}"

        baseline_report=""
        baseline_source="none"
        baseline_sbom="${BASELINE_DIR}/sbom.cdx.json"
        if [[ -s "${baseline_sbom}" ]]; then
          # Same DB, same moment: the diff reflects only what the change did to the image.
          if "${TRIVY}" sbom "${args[@]}" --output "${BASELINE_DIR}/report.json" "${baseline_sbom}"; then
            baseline_report="${BASELINE_DIR}/report.json"
            if [[ -n "${BASELINE_IMAGE_KEY}" ]]; then
              baseline_source="image"
            elif [[ "${ARTIFACT_FOUND}" == "true" ]]; then
              baseline_source="artifact"
            else
              baseline_source="cache"
            fi
          else
            echo "::warning::Baseline SBOM could not be scanned; skipping introduced/resolved diff."
          fi
        fi
        {
          echo "baseline-report=${baseline_report}"
          echo "baseline-source=${baseline_source}"
        } >> "${GITHUB_OUTPUT}"

    - name: Save baseline SBOM
      if: steps.meta.outputs.save-baseline == 'true'
      shell: bash
      env:
        SBOM_PATH: ${{ steps.meta.outputs.sbom-path }}
        BASELINE_DIR: ${{ steps.meta.outputs.baseline-dir }}
      run: |
        set -euo pipefail
        rm -rf "${BASELINE_DIR}"
        mkdir -p "${BASELINE_DIR}"
        cp "${SBOM_PATH}" "${BASELINE_DIR}/sbom.cdx.json"

    - name: Upload baseline SBOM to cache
      if: steps.meta.outputs.save-baseline == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.meta.outputs.baseline-dir }}
        key: ${{ steps.meta.outputs.baseline-save-key }}

    - name: Upload baseline SBOM artifact
      if: steps.meta.outputs.save-baseline == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: trivy-image-baseline-${{ steps.meta.outputs.slug }}
        path: ${{ steps.meta.outputs.baseline-dir }}/sbom.cdx.json
        if-no-files-found: warn
        overwrite: true

    - name: Build report
      id: report
      shell: bash
      env:
        REPORT_PATH: ${{ steps.meta.outputs.report-path }}
        BASELINE_REPORT: ${{ steps.scan.outputs.baseline-report }}
        BASELINE_SOURCE: ${{ steps.scan.outputs.baseline-source }}
        BASELINE_IMAGE_REF: ${{ inputs.baseline-image-ref }}
        COMMENT_PATH: ${{ steps.meta.outputs.work-dir }}/comment.md
        IMAGE_REF: ${{ inputs.image-ref }}
        IMAGE_NAME: ${{ steps.meta.outputs.image-name }}
        SLUG: ${{ steps.meta.outputs.slug }}
        SEVERITY: ${{ inputs.severity }}
        IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
        SBOM_CACHE_HIT: ${{ steps.check-sbom.outputs.valid == 'true' }}
        BASELINE_REF: ${{ steps.meta.outputs.baseline-ref }}
        TRIVY_BIN_VERSION: ${{ steps.meta.outputs.trivy-version }}
        MAX_ROWS: ${{ inputs.max-rows }}
      run: |
        set -euo pipefail
        bash "${GITHUB_ACTION_PATH}/report.sh" > "${COMMENT_PATH}"
        cat "${COMMENT_PATH}" >> "${GITHUB_STEP_SUMMARY}"
        echo "comment-path=${COMMENT_PATH}" >> "${GITHUB_OUTPUT}"

    - name: Post PR comment
      id: comment
      if: >-
        inputs.comment == 'true'
        && github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
      with:
        repo-token: ${{ inputs.github-token }}
        message-id: trivy-image-scan-${{ steps.meta.outputs.slug }}
        message-path: ${{ steps.report.outputs.comment-path }}

    - name: Comment fallback notice
      if: steps.comment.outcome == 'failure'
      shell: bash
      run: echo "::warning::Could not post the PR comment (does github-token have pull-requests:write?). The scan report is in the job summary."
