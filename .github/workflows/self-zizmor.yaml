name: zizmor GitHub Actions static analysis
on:
  push:
  pull_request:
    types:
      - edited
      - opened
      - ready_for_review
      - synchronize
      - reopened
  merge_group:
    types: [checks_requested]
jobs:
  zizmor-check:
    name: Check whether there are things to scan
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ (!github.event.repository.private || github.repository_owner != 'grafana') && 'ubuntu-latest' || 'ubuntu-any-minus' }} # grafana private repos use self-hosted runners (any arch, medium or smaller); other orgs use ubuntu-latest
    outputs:
      # GitHub's PR files API returns at most 3,000 files.
      found-files: >-
        ${{ (github.event_name == 'pull_request' && github.event.pull_request.changed_files >= 3000) && 'true' ||
            steps.pr-changes.outputs.zizmor || steps.zizmor-check.outputs.found-files }}
    steps:
      - name: Check pull request changes
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000
        id: pr-changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            zizmor:
              - '**/.github/workflows/**/*.{yml,yaml}'
              - '**/action.{yml,yaml}'
              - '**/{zizmor,.zizmor}.{yml,yaml}'
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for workflow and action definitions
        if: github.event_name != 'pull_request'
        id: zizmor-check
        shell: bash
        run: |
          FOUND_FILES=false
          SEARCH=$(find . -path "**/.github/workflows/*.yml" -o -path "**/.github/workflows/*.yaml" -o -path "**/action.yml" -o -path "**/action.yaml")
          if [ -n "$SEARCH" ]; then
              FOUND_FILES=true
          fi
          echo "found-files=${FOUND_FILES}" >> "$GITHUB_OUTPUT"
  zizmor:
    name: Run zizmor

    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: write
      security-events: write

    needs:
      - zizmor-check
    if: ${{ needs.zizmor-check.outputs.found-files == 'true' }}

    uses: grafana/shared-workflows/.github/workflows/reusable-zizmor.yml@363f83ea5c68eb24f36375a502318721b19599ed
    with:
      runs-on: ${{ (!github.event.repository.private || github.repository_owner != 'grafana') && 'ubuntu-latest' || 'ubuntu-any-minus' }} # grafana private repos use self-hosted runners (any arch, medium or smaller); other orgs use ubuntu-latest
      fail-severity: high
      min-severity: high
      min-confidence: low
      extra-args: --offline
      # Reusable workflow gates bench job on org + non-fork PR (OIDC/Vault not available on fork PRs); pass true to opt in.
      send-bench-metrics: true
      auto-delete-dangerous-branches: true
      auto-delete-slack-channel-id: C0B7DLH818A
    secrets: inherit
