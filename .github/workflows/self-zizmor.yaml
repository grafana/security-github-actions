name: zizmor GitHub Actions static analysis
on:
  push:
  pull_request:
    types:
      - edited
      - opened
      - ready_for_review
      - synchronize
      - reopened
  merge_group:
    types: [checks_requested]
jobs:
  zizmor-check:
    name: Check whether there are things to scan
    permissions:
      contents: read
      # TODO: Remove after the secret migration grace period ends on December 7, 2026.
      # See: https://github.com/grafana/deployment_tools/issues/809938
      pull-requests: write
    runs-on: ${{ (!github.event.repository.private || github.repository_owner != 'grafana') && 'ubuntu-latest' || 'ubuntu-any-minus' }} # grafana private repos use self-hosted runners (any arch, medium or smaller); other orgs use ubuntu-latest
    outputs:
      found-files: ${{ steps.zizmor-check.outputs.found-files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run zizmor
        id: zizmor-check
        shell: bash
        run: |
          FOUND_FILES=false
          SEARCH=$(find . -path "**/.github/workflows/*.yml" -o -path "**/.github/workflows/*.yaml" -o -path "**/action.yml" -o -path "**/action.yaml")
          if [ -n "$SEARCH" ]; then
              FOUND_FILES=true
          fi
          echo "found-files=${FOUND_FILES}" >> "$GITHUB_OUTPUT"

      - name: Find GitHub secret references
        id: secret-references
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          reference="secrets[[:space:]]*(\.[[:space:]]*[A-Za-z_][A-Za-z0-9_]*|\[[[:space:]]*['\"][A-Za-z_][A-Za-z0-9_]*['\"][[:space:]]*\])"
          secret_references=''
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [[ -f $file && ! -L $file ]] || continue
            matches=$(grep -Eio "$reference" "$file" || [[ $? -eq 1 ]])
            names=$(printf '%s\n' "$matches" | tr '[:lower:]' '[:upper:]' | sed 's/^SECRETS//; s/[^A-Z0-9_]//g; /^GITHUB_TOKEN$/d; /^$/d' | LC_ALL=C sort -u)
            formatted=''
            while IFS= read -r name; do
              [[ -n $name ]] || continue
              formatted+="${formatted:+, }\`$name\`"
            done <<< "$names"
            [[ -z $formatted ]] || secret_references+="- \`$file\`: $formatted"$'\n'
          done
          printf 'secret_references<<EOF\n%s\nEOF\n' "$secret_references" >> "$GITHUB_OUTPUT"

      - name: Comment with secret migration notice
        if: steps.secret-references.outcome == 'success' && steps.secret-references.outputs.secret_references != ''
        continue-on-error: true
        uses: int128/comment-action@304df51b76a99f2ba948f8d780d789b5ecc22893 # v1.80.0
        with:
          update-if-exists: replace
          update-if-exists-key: github-actions-secret-removal-notice
          post: |
            ### GitHub Actions secret migration notice

            We found these secret references in this repository's workflow files:

            ${{ steps.secret-references.outputs.secret_references }}

            **All GitHub Actions secrets are scheduled for removal on Monday, December 7, 2026.**

            If these references use secrets stored in GitHub, you must move them to Vault and update the workflows before that date. Follow the [Vault migration guidance](https://enghub.grafana-ops.net/docs/default/component/deployment-tools/platform/vault/#ci-secrets-for-repositories-outside-the-grafana-org).

            > [!NOTE]
            > If your workflow needs GitHub App authentication but you lack access to define the [GitHub App Token Broker (GATB) configuration](https://enghub.grafana-ops.net/docs/default/component/deployment-tools/platform/vault/github-app-token-broker/) in `grafana/deployment_tools` or register the App credentials in Vault, submit a [GitHub App Authentication Setup request](https://helpdesk2.grafana.com/submit/e537fff8-1871-4f32-bd7d-761d6cdef734) for assistance from Platform Productivity squad.

      - name: Hide resolved secret migration notice
        if: steps.secret-references.outcome == 'success' && steps.secret-references.outputs.secret_references == ''
        continue-on-error: true
        uses: int128/hide-comment-action@430b7e736ceb7372703a3022d1a5a26f07328207 # v1.78.0
        with:
          ends-with: "<!-- comment-action/github-actions-secret-removal-notice -->"

  zizmor:
    name: Run zizmor

    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: write
      security-events: write

    needs:
      - zizmor-check
    if: ${{ needs.zizmor-check.outputs.found-files == 'true' }}

    uses: grafana/shared-workflows/.github/workflows/reusable-zizmor.yml@030bdd10e567ae3cc62533c5b356dd151e96e323 # main
    with:
      runs-on: ${{ (!github.event.repository.private || github.repository_owner != 'grafana') && 'ubuntu-latest' || 'ubuntu-any-minus' }} # grafana private repos use self-hosted runners (any arch, medium or smaller); other orgs use ubuntu-latest
      fail-severity: high
      min-severity: high
      min-confidence: low
      extra-args: --offline
      # Reusable workflow gates bench job on org + non-fork PR (OIDC/Vault not available on fork PRs); pass true to opt in.
      send-bench-metrics: true
      auto-delete-dangerous-branches: true
      auto-delete-slack-channel-id: C0B7DLH818A
    secrets: inherit
