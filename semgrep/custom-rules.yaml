rules:
  - id: deny-actions-create-github-app-token
    patterns:
      - pattern-regex: "uses:\\s*actions/create-github-app-token"
    paths:
      include:
        - "*.yaml"
        - "*.yml"
    message: >
      Do not use actions/create-github-app-token. Use the organization's
      approved [alternative for generating GitHub App tokens](https://enghub.grafana-ops.net/docs/default/component/deployment-tools/platform/vault/github-app-token-broker-migration-guide/).
    languages: [generic]
    severity: LOW
  # Incident-cleanup rule: can be removed once all repos are on a fixed
  # create-github-app-token release. Allowlist by design; the org-level
  # Actions policy remains the enforcement mechanism.
  - id: require-current-create-github-app-token
    patterns:
      - pattern-regex: "uses:\\s*grafana/shared-workflows/actions/create-github-app-token@(?!46f48da11e78ebdba7a8747ae456b11062fac83e)"
    paths:
      include:
        - "*.yaml"
        - "*.yml"
    message: >
      Pin grafana/shared-workflows/actions/create-github-app-token to
      46f48da11e78ebdba7a8747ae456b11062fac83e (create-github-app-token/v0.3.1)
      or a newer release SHA. Older references are disabled by the organization's
      Actions policy and will fail at runtime. If you are pinning a release newer
      than v0.3.1, add its SHA to the allowlist in this rule.
    languages: [generic]
    severity: HIGH
